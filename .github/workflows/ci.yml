name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Race tests and Python runtime tests
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build and inspect the CLI
        run: |
          go build -trimpath -o bin/allset ./cmd/allset
          bin/allset --version
          bin/allset --help
          bin/allset config schema --project | python3 -m json.tool > /dev/null
          bin/allset config schema | python3 -m json.tool > /dev/null
          bin/allset backends --json | python3 -m json.tool > /dev/null
      - name: Packaged CLI in an offline container
        if: runner.os == 'Linux'
        run: |
          python3 scripts/build-release.py "$RUNNER_TEMP/allset-release"
          python3 scripts/test-container.py "$RUNNER_TEMP"/allset-release/*_linux_amd64.tar.gz
